
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Logged Out | TnP Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .logout-card {
            max-width: 450px;
            width: 90%;
            background: white;
            padding: 45px 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .check {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #d1e7dd;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
        }

        .logout-card h2 {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .logout-card p {
            color: #6c757d;
        }

        .login-btn {
            margin-top: 20px;
            padding: 11px 25px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="logout-card">

        <div class="check">
            ✓
        </div>

        <h2>Logged Out Successfully!</h2>

        <p>
            You have safely logged out of the
            TnP Management System.
        </p>

        <a href="{% url 'login_view' %}" class="btn btn-primary login-btn">
            Login Again
        </a>

        <p class="small mt-4 mb-0">
            Training and Placement Management System
        </p>

    </div>

</body>

</html>
